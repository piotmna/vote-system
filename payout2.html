<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>払い戻し結果</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>払い戻し結果</h2>

    <label>大会IDを入力</label>
    <input type="number" id="tournamentId" placeholder="例：1">

    <button onclick="loadPayout()">結果を表示</button>

    <div id="result" class="result-box"></div>
  </div>

  <script>
    async function loadPayout() {
      const tId = document.getElementById("tournamentId").value;

      if (!tId) {
        alert("大会IDを入力してください");
        return;
      }

      const res = await fetch(`/api/payout/me/${tId}`);
      const data = await res.json();

      document.getElementById("result").innerHTML = `
        <p><strong>総投票額：</strong> ${data.TotalBet} 円</p>
        <p><strong>総払い戻し：</strong> ${data.TotalPayout} 円</p>
        <p><strong>回収率：</strong> ${
          data.TotalBet === 0
            ? "0%"
            : Math.round((data.TotalPayout / data.TotalBet) * 100) + "%"
        }</p>
      `;
    }
  </script>
</body>
</html>
